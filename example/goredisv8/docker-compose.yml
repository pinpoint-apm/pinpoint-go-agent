services:
  redis-1:
    image: redis:6-alpine
    container_name: redis-goredisv8-test-1
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-2:
    image: redis:6-alpine
    container_name: redis-goredisv8-test-2
    ports:
      - "6380:6380"
    # A single-node cluster that owns every slot. It announces 127.0.0.1:6380,
    # the address the cluster client on the host reaches it at. Redis 6, since
    # go-redis v8 cannot parse the node entries of a Redis 7 CLUSTER SLOTS reply.
    command: sh -c "(until redis-cli -p 6380 ping >/dev/null 2>&1; do sleep 0.2; done; redis-cli -p 6380 cluster addslots $$(seq 0 16383)) & exec redis-server --port 6380 --cluster-enabled yes --cluster-announce-ip 127.0.0.1 --appendonly yes"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6380 cluster info | grep -q cluster_state:ok"]
      interval: 5s
      timeout: 3s
      retries: 5

