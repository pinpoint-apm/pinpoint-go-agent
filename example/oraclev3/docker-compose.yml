services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: oraclev3-test
    environment:
      ORACLE_PASSWORD: tiger
      APP_USER: scott
      APP_USER_PASSWORD: tiger
    ports:
      - "1521:1521"
    volumes:
      - ./init.sql:/container-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
