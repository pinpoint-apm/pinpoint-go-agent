services:
  mssql:
    # amd64 only: on Apple Silicon, turn on Docker Desktop's
    # "Use Rosetta for x86_64/amd64 emulation" (QEMU emulation crashes it).
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: mssql-pinpoint-test
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: TestPass123
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P TestPass123 -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
