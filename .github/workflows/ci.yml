name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Run each matrix entry with the toolchain it names. With the default
# GOTOOLCHAIN=auto, a dependency whose go.mod asks for a newer Go makes the go
# command download that toolchain and the 1.25.x job silently tests 1.26. With
# local, such a drift fails the job instead, which is what tells us a
# dependency raised the floor (agent_changes 17 of the compile-time
# instrumentation tool; its own CI does the same).
env:
  GOTOOLCHAIN: local

jobs:

  build:
    runs-on: ubuntu-latest
    # go.mod's floor and the newest toolchain the agent is verified against.
    # fail-fast is off so a break on one version still reports the other,
    # which is what tells a version-specific regression from a real one.
    strategy:
      fail-fast: false
      matrix:
        go-version: [ 1.25.x, 1.26.x ]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        # The nested test module has its own dependencies, so the module cache
        # key has to follow both go.sum files.
        cache-dependency-path: |
          go.sum
          test/it/go.sum
          example/go.sum

    - name: Build
      run: go build -v

    # The agent supports exactly the four architectures internal/asm has a
    # Getg body for, and this runner is one of them. Type-checking the module
    # for the other three is what compiles their assembly declarations and
    # the goid path at all in CI; no emulation, a few seconds.
    - name: Vet the supported architectures
      run: |
        for arch in 386 amd64 arm arm64; do
          echo "::group::GOARCH=$arch"
          GOARCH=$arch go vet ./...
          echo "::endgroup::"
        done

    # staticcheck 2026.2 (v0.8.1) is built for Go 1.26, so under
    # GOTOOLCHAIN=local only the 1.26 entry can run it; the code it checks is
    # the same on both. The deliberate uses of deprecated API - the
    # database/sql fallbacks, the balancer's NewSubConn - carry lint:ignore
    # directives naming the reason, so a new finding is a new problem.
    - name: Staticcheck
      if: matrix.go-version == '1.26.x'
      # internal/protobuf is generated (protoc, grpcmock) and is not ours to lint.
      run: |
        go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 $(go list ./... | grep -v /internal/protobuf)
        (cd test/it && go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...)
        (cd test/e2e && go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...)
        # The kratos examples carry generated protobuf code of their own.
        (cd example && go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 $(go list ./... | grep -v /helloworld))

    # -race for the same reason the plugin job uses it: the agent's own workers,
    # span queue, config snapshot and metadata caches are all concurrent, and
    # a race there is exactly the class of bug this suite exists to catch.
    # ./... rather than the root package alone: internal/asm has a test of its
    # own now, and the other packages of the module have none to cost anything.
    - name: Test
      run: go test -race -v ./...

    # The mock-collector integration suite is a nested module (it depends on
    # plugin/http) and needs no collector or network access, so it runs here
    # alongside the unit tests. The live end-to-end suite in test/e2e is not
    # registered: it needs a dev collector.
    - name: Integration test
      run: go test -race -v -timeout 15m ./...
      working-directory: test/it

    # The examples are a separate module with one main per subdirectory and no
    # tests, so building them is the whole check - it catches an example left
    # behind by an API change, which nothing else here would.
    - name: Build examples
      run: go build -v ./... && go vet ./...
      working-directory: example

  # The instrumentation plugins are separate modules with their own
  # dependencies, so they get their own job: it runs alongside the agent's and
  # keeps its own module cache, which the agent's dependencies do not
  # invalidate.
  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go-version: [ 1.25.x, 1.26.x ]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache-dependency-path: plugin/*/go.sum

    # One module at a time, since each plugin has its own go.mod. The plugin
    # examples live in the root example module and are built by the agent
    # job, so go build ./... and go test both stay on the module's own
    # package. Several plugins guard against data
    # races the agent's tracers are sensitive to, so -race is part of the
    # contract, not an extra. Every module runs before the step fails, so one
    # broken plugin does not hide the rest.
    - name: Plugin build and test
      run: |
        failed=()
        for dir in plugin/*/; do
          echo "::group::${dir}"
          (cd "$dir" && go build ./... && go test -race -v ./) || failed+=("$dir")
          echo "::endgroup::"
        done
        if [ ${#failed[@]} -ne 0 ]; then
          printf 'FAILED: %s\n' "${failed[@]}"
          exit 1
        fi

  # Go 1.26's experimental goroutine leak profile over the integration suite.
  # It reports goroutines still blocked on a concurrency primitive nothing can
  # reach after every test's agent has shut down - the shape a worker that
  # outlived Shutdown has, which runtime.NumGoroutine() comparisons can only
  # guess at. The check lives in test/it's TestMain and is a no-op in every
  # build without this GOEXPERIMENT, so it costs the other jobs nothing.
  #
  # Its own job rather than a matrix entry on build: the experiment rebuilds
  # the runtime, so it shares no build cache with the ordinary runs, and it
  # pins 1.26 because no earlier toolchain has the profile.
  goroutine-leak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.26.x
        cache-dependency-path: |
          go.sum
          test/it/go.sum

    - name: Integration test with the goroutine leak profile
      run: go test -v -timeout 15m ./...
      working-directory: test/it
      env:
        GOEXPERIMENT: goroutineleakprofile

  # The published modules have to agree with each other: every reference names
  # the module paths of the root module's major version, and every requirement
  # between them names the same version, resolved by a replace directive to
  # that module's directory. The jobs above resolve the modules through those
  # replace directives, so they pass either way; a user's build, which ignores
  # them, is the one that would break. The check needs git and perl, no Go.
  modules:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Module paths and in-repo requirements
      run: scripts/set-major-version.sh --check
