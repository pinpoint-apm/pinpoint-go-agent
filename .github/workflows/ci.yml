name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.23.x
        # The nested test module has its own dependencies, so the module cache
        # key has to follow both go.sum files.
        cache-dependency-path: |
          go.sum
          test/it/go.sum

    - name: Build
      run: go build -v

    - name: Test
      run: go test -v

    # The mock-collector integration suite is a nested module (it depends on
    # plugin/http) and needs no collector or network access, so it runs here
    # alongside the unit tests. The live end-to-end suite in test/e2e is not
    # registered: it needs a dev collector.
    - name: Integration test
      run: go test -v -timeout 15m ./...
      working-directory: test/it

  # The instrumentation plugins are separate modules with their own
  # dependencies, so they get their own job: it runs alongside the agent's and
  # keeps its own module cache, which the agent's dependencies do not
  # invalidate.
  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.23.x
        cache-dependency-path: plugin/*/go.sum

    # One module at a time, since each plugin has its own go.mod. Only the
    # module's own package is tested: the example directories are standalone
    # programs that do not build as a single package. Several plugins guard
    # against data races the agent's tracers are sensitive to, so -race is
    # part of the contract, not an extra. Every module runs before the step
    # fails, so one broken plugin does not hide the rest.
    - name: Plugin test
      run: |
        failed=()
        for dir in plugin/*/; do
          echo "::group::${dir}"
          (cd "$dir" && go test -race -v ./) || failed+=("$dir")
          echo "::endgroup::"
        done
        if [ ${#failed[@]} -ne 0 ]; then
          printf 'FAILED: %s\n' "${failed[@]}"
          exit 1
        fi
