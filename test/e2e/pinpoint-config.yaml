# Pinpoint Go Agent - full-feature end-to-end test configuration.
# Every process in the run reads this file; per-process identity and the
# collector host come from PINPOINT_GO_* environment variables set by
# run_e2e.sh.

Enable: true

IsContainerEnv: true

# --- Identity ---
# v4 UIDs register under a service; every process of the run shares this one.
# A 3.1.x collector accepts only v3: export PINPOINT_GO_UID_VERSION=v3 for it.
Uid:
  Version: "v4"
ServiceName: "pinpoint-go-e2e"

# --- Collector (gRPC) ---
# Collector.Host is intentionally absent: run_e2e.sh must supply
# PINPOINT_GO_COLLECTOR_HOST, which makes the collector an explicit runtime
# setting rather than a file default.
Collector:
  AgentPort: 9991
  SpanPort: 9993
  StatPort: 9992

  # Periodic AgentInfo re-send, every 24h by default in the agent; the live
  # suite shortens it so a long run exercises the refresh scheduler and its
  # bounded retry, not just the boot registration.
  AgentInfo:
    RefreshInterval: 30000 # ms; 0 disables the periodic re-send
    SendRetryInterval: 3000 # ms between tries within one refresh
    MaxTryPerAttempt: 3

  # Channel options, spelled out at their defaults so a run exercises the
  # configured path rather than the built-in constants.
  Grpc:
    KeepAliveTime: 30000 # ms
    KeepAliveTimeout: 60000 # ms
    KeepAlivePermitWithoutCalls: false
    MaxSendMessageSize: 4194304
    MaxReceiveMessageSize: 4194304
    FlowControlWindow: 1048576
    WriteBufferSize: 65536
    MaxHeaderListSize: 8192
    # For a TLS collector, set these (or PINPOINT_GO_COLLECTOR_GRPC_SSLENABLE
    # and PINPOINT_GO_COLLECTOR_GRPC_TRUSTCERTFILEPATH) on the run. An empty
    # trust path with TLS on falls back to the system root CAs.
    SslEnable: false
    TrustCertFilePath: ""
    # Connection and stream renewal, off by default in the agent (0), and set
    # to spread long-running agents across a scaled-out collector, e.g.
    # 600000. Short here so every run rotates the collector connections
    # (make-before-break) and renews the stat stream against the live
    # collector; run_e2e.sh asserts both from the logs.
    ConnectionMaxAge: 10000 # ms
    StreamMaxAge: 10000 # ms
    # Span batching is set off the agent's defaults (50, 1000, 500, 10).
    SpanBatchSize: 8 # small so the smoke run crosses batches; --load-only uses 50
    SpanBatchFlushInterval: 500
    SpanBatchCollectDeadline: 1000
    SpanBatchMaxConcurrentRequests: 4

# --- Logging ---
Log:
  Level: "info" # debug / info / warn / error
  Output: "stderr" # the runner captures one file per process
  MaxSize: 50 # MB

# --- Sampling ---
# CounterRate 1 samples every request.
Sampling:
  Type: "COUNTER"
  CounterRate: 1
  PercentRate: 100
  NewThroughput: 0 # unlimited
  ContinueThroughput: 0 # unlimited

# --- Span ---
Span:
  QueueSize: 4096 # larger queue for the load phase
  MaxCallStackDepth: 16 # /deep?depth=32 verifies depth overflow safely
  MaxCallStackSequence: 128 # /wide?width=256 verifies sequence overflow safely
  EventChunkSize: 8 # forces multiple PSpanChunk sends in the smoke phase

# --- Statistics ---
# A batch of 2 sends the stat stream every 10s rather than the default 30s,
# so a short run reaches a send past Collector.Grpc.StreamMaxAge.
Stat:
  CollectInterval: 5000 # ms
  BatchCount: 2

# --- HTTP ---
Http:
  UrlStat:
    Enable: true
    LimitSize: 1024
    QueueSize: 4096 # per-request records buffered until the next aggregation
    WithMethod: true
  Server:
    StatusCodeErrors: ["4xx", "5xx"]
    # One entry per pattern kind the Ant matcher compiles to, each exercised by
    # a /filter/* probe in smoke_test.sh: exact, '**' prefix, single-'*' segment
    # prefix, a wildcard mid-pattern, and a single-character wildcard. Nothing
    # else in the suite lives under /filter/, so these cannot silently drop
    # spans another assertion depends on.
    ExcludeUrl:
      - "/filter/exact" # exact
      - "/filter/prefix/**" # prefix
      - "/filter/seg/*" # segment prefix
      - "/filter/*/ant/**" # ant, wildcard mid-pattern
      - "/filter/q?ery" # ant, single-character wildcard
    # OPTIONS is used by nothing else here, so excluding it cannot affect
    # another assertion.
    ExcludeMethod: ["OPTIONS"]
    # Off by default in the agent; the smoke requests carry a query string,
    # a user proxy header and cookies for these to record.
    RecordRequestParam: true
    ProxyUserHeaderNames:
      - "X-E2E-Proxy-Time"
    RecordRequestHeader:
      - "User-Agent"
      - "Content-Type"
      - "Accept"
      - "Host"
      - "X-Request-ID"
      - "X-Forwarded-For"
    RecordRequestCookie:
      - "session_id"
      - "token"
    RecordResponseHeader:
      - "Content-Type"
      - "X-Response-Time"
      - "X-Request-ID"
  Client:
    RecordRequestHeader:
      - "User-Agent"
      - "Content-Type"
      - "Host"
      - "X-Request-ID"
    RecordResponseHeader:
      - "Content-Type"
      - "X-It-Trace-Id"
      - "X-It-Span-Id"
    RecordRequestCookie:
      - "session_id"
      - "token"
    RecordUrlQuery: true

# --- SQL ---
SQL:
  TraceQueryStat: true
  TraceBindValue: true
  MaxBindValueSize: 2048
  # The /db-* endpoints replay the same statements repeatedly, so this keeps
  # the normalizer off the hot path.
  EnableRawSqlCache: true

# --- Errors ---
Error:
  TraceCallStack: true
  CallStackDepth: 32
