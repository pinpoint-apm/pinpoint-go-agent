syntax = "proto3";

// The gRPC service the end-to-end suite and the grpc examples talk over.
// Generated by scripts/generate-protobuf.sh into this directory.
option go_package = "github.com/pinpoint-apm/pinpoint-go-agent/v2/test/testapp";

service Hello {
    rpc UnaryCallUnaryReturn(Greeting) returns (Greeting) {}
    rpc UnaryCallStreamReturn(Greeting) returns (stream Greeting) {}
    rpc StreamCallUnaryReturn(stream Greeting) returns (Greeting) {}
    rpc StreamCallStreamReturn(stream Greeting) returns (stream Greeting) {}
}

message Greeting {
    string msg = 1;
}
